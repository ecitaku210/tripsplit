name: Build and deploy to GitHub Pages

# A PWA can only be installed to a home screen over HTTPS — service workers
# are blocked on plain http (localhost excepted). GitHub Pages gives that for
# free, which is why deployment is wired up rather than left as an exercise.

on:
  push:
    branches: [main]
  # Without this, a pull request runs no checks at all and nothing stops a
  # change with failing tests from being merged. PRs run the build job only;
  # publishing is guarded below.
  pull_request:
  workflow_dispatch:

# Every action below is pinned to a major that runs on Node 24. The previous
# majors ran on Node 20, which GitHub has deprecated: today that is only a
# warning, but it turns into a hard failure once Node 20 leaves the runner
# image — silently breaking the deploy on a date we do not control.
#
# upload-pages-artifact matters transitively as well: v3 wrapped
# upload-artifact@v4 (Node 20), while v5 pins upload-artifact v7 (Node 24).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One run per branch or PR. Pushes to main still serialise, so two deploys
  # can never race each other, while a new push to a PR cancels the test run
  # it just superseded.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Must satisfy the `engines` floor in package.json (>=22.12), which
          # Vitest 5 sets. `22` resolves to the latest 22.x, which does.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        # Pages serves a project site from https://<user>.github.io/<repo>/,
        # so every asset URL has to be prefixed with the repo name. Deriving
        # it here keeps the app working if the repo is ever renamed.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  emulator:
    # The Firebase config ships inside the public bundle, so firestore.rules
    # is the only thing protecting the database. This job runs the rules
    # suite and the two-phone sync tests against Google's real Firestore
    # emulator on every push and pull request, so a rules change that opens
    # the database to the internet fails CI instead of reaching production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Security rules and live-sync tests
        run: npm run test:emulator

  deploy:
    # A pull request must never publish to the live site — it would put
    # unreviewed code on the URL the whole group has installed. PRs stop after
    # the build job, which is the part that actually verifies anything.
    if: github.event_name != 'pull_request'
    # Never publish a build whose rules or sync tests failed.
    needs: [build, emulator]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
